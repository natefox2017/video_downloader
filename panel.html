<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>视频下载</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <ul class="list" id="list"></ul>

  <div class="empty" id="empty">
    <p>还没有识别到视频</p>
  </div>

  <footer class="actionbar">
    <button type="button" class="btn-primary" id="download" disabled>
      <span id="download-label">下载视频</span>
    </button>
  </footer>

  <div class="toast" id="toast"></div>

  <div class="preview" id="preview" aria-hidden="true">
    <button class="preview__backdrop" id="preview-backdrop" type="button" aria-label="关闭预览"></button>
    <div class="preview__dialog">
      <button class="preview__close" id="preview-close" type="button" aria-label="关闭预览">×</button>
      <video class="preview__video" id="preview-video" controls playsinline></video>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
