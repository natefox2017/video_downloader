[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-frame-tool"
version = "3.1.0"
description = "短视频批处理工具（GUI）：封面 + 前贴/尾贴拼接 + 复刻22 混淆（本地拒读、平台可播）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
keywords = ["ffmpeg", "video", "tkinter", "batch", "short-video"]
classifiers = [
    "Environment :: X11 Applications",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
# 运行期**没有任何第三方依赖**（ffmpeg/ffprobe 走外部可执行文件）
dependencies = []

[project.optional-dependencies]
# 只有没装 ffmpeg 的机器才需要它，作为最后兜底
ffmpeg = ["imageio-ffmpeg"]

[project.scripts]
video-frame-tool = "src.__main__:main"

[project.gui-scripts]
video-frame-tool-gui = "src.__main__:main"

[tool.setuptools]
# src 布局：包内容在 src/ 目录，包名 = src
package-dir = { "" = "src" }
packages = ["src", "src.ui"]
