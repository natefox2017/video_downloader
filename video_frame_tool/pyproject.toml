[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-frame-tool"
version = "1.0.0"
description = "短视频批处理工具（GUI）：换首帧、贴商品图、加随机拼接画中画"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
keywords = ["ffmpeg", "video", "tkinter", "batch", "short-video"]
classifiers = [
    "Environment :: X11 Applications",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
# 运行期**没有任何第三方依赖**（ffmpeg/ffprobe 走外部可执行文件）
dependencies = []

[project.optional-dependencies]
# 只有没装 ffmpeg 的机器才需要它，作为最后兜底
ffmpeg = ["imageio-ffmpeg"]

[project.scripts]
video-frame-tool = "video_frame_tool.__main__:main"

[project.gui-scripts]
video-frame-tool-gui = "video_frame_tool.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
