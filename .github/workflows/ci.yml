name: ci

# Quick checks on every push to main and every PR.
# This is intentionally light (syntax + manifest parse) so PRs get fast
# feedback and the automerge workflow can proceed. The thorough validation
# suite runs in release.yml, which only triggers on version tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          set -e
          for f in background.js rules.js content.js panel.js extractors/*.js; do
            node --check "$f"
          done

      - name: Manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json parses OK')"
