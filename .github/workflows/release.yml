name: release

# Full CI + CRX packaging. Runs ONLY on version tags (v*).
# Pushing to main or opening a PR never triggers this.
#
# Release flow:
#   1. Bump `version` in manifest.json (e.g. 2.4.0), commit, push to main
#   2. git tag v2.4.0 && git push origin v2.4.0
# The tag must match manifest.json's version (v2.4.0 <-> 2.4.0),
# otherwise the job fails before packaging anything.
#
# Signing: for a stable extension ID across releases, add a persistent
# PEM private key as the CRX_PRIVATE_KEY repository secret. Without it
# an ephemeral key is generated and the extension ID changes every release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------- full CI ----------------
      - name: Full CI - JS syntax check
        run: |
          set -e
          for f in background.js rules.js content.js panel.js extractors/*.js; do
            echo "-- node --check $f"
            node --check "$f"
          done
          echo "all extension scripts pass syntax check"

      - name: Full CI - manifest validation
        run: |
          node << 'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          // 1. tag version must match manifest version (v2.3.0 -> 2.3.0)
          const tag = process.env.GITHUB_REF_NAME || '';
          const tagVer = tag.startsWith('v') ? tag.slice(1) : tag;
          if (m.version !== tagVer) {
            throw new Error(`manifest version ${m.version} does not match tag ${tag}`);
          }
          if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');

          // 2. every file referenced by the manifest must exist
          const refs = new Set(['background.js', 'content.js', 'panel.html', 'panel.js', 'panel.css', 'rules.js']);
          for (const cs of m.content_scripts || []) {
            for (const f of cs.js || []) refs.add(f);
          }
          for (const f of refs) {
            if (!fs.existsSync(f)) throw new Error(`referenced file missing: ${f}`);
          }

          // 3. icons must exist
          for (const p of Object.values(m.icons || {})) {
            if (!fs.existsSync(p)) throw new Error(`icon missing: ${p}`);
          }

          // 4. every platform with an extractor in rules.js must be registered in the manifest
          const rules = fs.readFileSync('rules.js', 'utf8');
          const registered = new Set();
          for (const cs of m.content_scripts || []) {
            for (const f of cs.js || []) {
              const mm = f.match(/^extractors\/([a-z]+)\.js$/);
              if (mm) registered.add(mm[1]);
            }
          }
          for (const match of rules.matchAll(/extractor:\s*"([^"]+)"/g)) {
            if (!registered.has(match[1])) {
              throw new Error(`extractor not registered in manifest: ${match[1]}`);
            }
          }

          console.log(`manifest OK (${m.name} v${m.version}, ${refs.size} files, ${registered.size} extractors)`);
          EOF

      # ---------------- CRX packaging ----------------
      - name: Stage extension files
        run: |
          rm -rf dist && mkdir -p dist
          cp manifest.json background.js rules.js content.js panel.html panel.js panel.css dist/
          cp -r extractors images dist/

      - name: Prepare signing key
        run: |
          if [ -n "${{ secrets.CRX_PRIVATE_KEY }}" ]; then
            printf '%s' "${{ secrets.CRX_PRIVATE_KEY }}" > key.pem
            echo "Using CRX_PRIVATE_KEY secret (stable extension ID across releases)."
          else
            echo "::warning::CRX_PRIVATE_KEY secret not set - generating an ephemeral key. The extension ID will change on every release; add a persistent PEM key as the CRX_PRIVATE_KEY secret for stable updates."
            openssl genrsa -out key.pem 2048
          fi

      - name: Pack CRX
        run: |
          npx -y crx@latest pack "$PWD/dist" -p "$PWD/key.pem" -o "$PWD/video-downloader.crx"
          rm -f key.pem
          ls -la video-downloader.crx

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: video-downloader.crx
          generate_release_notes: true
