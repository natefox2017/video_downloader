name: Release Chrome Web Store ZIP and optional CRX3

# Production releases are triggered ONLY by v-prefixed version tags.
# Example: git tag v2.4.0 && git push origin v2.4.0
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require tag's commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit already merged into main."
            exit 1
          fi

      - name: Verify source and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/release.mjs
          bash -n scripts/build-store.sh
          for script in background.js rules.js content.js panel.js options.js monitor.js extractors/*.js; do
            node --check "$script"
          done
          node --test tests/*.test.js

      - name: Build Chrome Web Store ZIP (minified)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-store.sh "$GITHUB_REF_NAME" "$PWD/.release"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync(".release/stage/extension/manifest.json","utf8")).version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chrome Web Store build ready: video-downloader-v${version}-chrome-web-store.zip"

      - name: Optionally sign CRX3 (same minified files)
        shell: bash
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$CRX_PRIVATE_KEY" ]]; then
            echo "::notice::CRX_PRIVATE_KEY is not configured; Web Store ZIP is ready. Skipping optional self-hosted CRX3."
            exit 0
          fi

          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/crx-signing.XXXXXX.pem")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$CRX_PRIVATE_KEY" > "$key_file"
          if ! openssl pkey -in "$key_file" -check -noout > /dev/null 2>&1; then
            echo "::error::CRX_PRIVATE_KEY must be a valid, unencrypted PEM private key."
            exit 1
          fi

          npx --yes crx3@2.0.0 \
            -p "$key_file" \
            -o "$PWD/.release/assets/video-downloader-v${VERSION}.crx" \
            -z "$RUNNER_TEMP/optional-crx-archive.zip" \
            "$PWD/.release/stage/extension"
          node scripts/release.mjs verify-crx ".release/assets/video-downloader-v${VERSION}.crx"
          rm -f "$RUNNER_TEMP/optional-crx-archive.zip"

      - name: Compute and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          zip=".release/assets/video-downloader-v${VERSION}-chrome-web-store.zip"
          test -s "$zip"
          unzip -tq "$zip"
          (
            cd .release/assets
            sha256sum "video-downloader-v${VERSION}-chrome-web-store.zip" > SHA256SUMS.txt
            if [[ -f "video-downloader-v${VERSION}.crx" ]]; then
              sha256sum "video-downloader-v${VERSION}.crx" >> SHA256SUMS.txt
            fi
            sha256sum -c SHA256SUMS.txt
          )
          ls -lh .release/assets/

      - name: Publish packages on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Video Downloader v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .release/assets/*
          body: |
            Automatically built from Git tag ${{ github.ref_name }}.

            - **Chrome Web Store upload**: download \`video-downloader-v${{ steps.version.outputs.version }}-chrome-web-store.zip\` and upload it in the Chrome Web Store Developer Dashboard.
            - **JavaScript** is minified using pinned esbuild, but is **not encrypted or obfuscated** (Chrome Web Store policy).
            - **CRX3** is available only when the repository has an existing \`CRX_PRIVATE_KEY\` Actions secret; this package is optional and is not submitted to the Chrome Web Store.
            - **SHA256SUMS.txt** includes checksums of the generated packages.

            Uploading this ZIP prepares a Chrome Web Store submission; Google's listing, privacy and manual review steps are still required.
