<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频下载 - 插件设置</title>
  <link rel="stylesheet" href="vendor/pico.min.css" />
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" aria-label="应用侧边栏">
      <a class="brand" href="monitor.html" aria-label="视频下载助手首页">
        <img class="brand__logo" src="images/logo.svg" width="52" height="52" alt="" />
        <span class="brand__text">
          <strong>视频下载助手</strong>
          <small id="version"></small>
        </span>
      </a>
      <nav class="side-nav" aria-label="功能菜单">
        <span class="side-nav__heading">功能</span>
        <a class="side-nav__link" href="monitor.html">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
          批量下载
        </a>
        <a class="side-nav__link is-active" href="options.html" aria-current="page">
          <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg>
          插件设置
        </a>
      </nav>
      <div class="sidebar-support">
        <span class="side-nav__heading">项目</span>
        <a class="side-nav__link" href="https://github.com/natefox2017/video_downloader" target="_blank" rel="noreferrer">开源仓库</a>
        <a class="side-nav__link" href="https://github.com/natefox2017/video_downloader/issues/new" target="_blank" rel="noreferrer">反馈 Bug</a>
      </div>
    </aside>

    <main class="app-main" id="main-content">
      <div class="page-content">
        <header class="page-header">
          <h1>插件设置</h1>
          <p>设置下载偏好与各平台的视频识别方式</p>
        </header>

        <section class="surface" aria-labelledby="download-settings-title">
          <h2 id="download-settings-title">下载设置</h2>
          <div class="settings-grid">
            <div class="settings-field">
              <label for="format">视频格式</label>
              <span class="ui-select-wrap">
                <select id="format" class="ui-select">
                  <option value="source">源格式（推荐）</option>
                  <option value="mp4">MP4 优先（有 MP4 源时）</option>
                </select>
              </span>
              <p class="field-help">不转码，只调整已有视频源的优先级。</p>
            </div>
            <div class="settings-field">
              <label for="quality">默认清晰度</label>
              <span class="ui-select-wrap"><select id="quality" class="ui-select"></select></span>
              <p class="field-help">只在网站提供多个清晰度时生效。</p>
            </div>
            <div class="settings-field">
              <label for="concurrency">每个网页并发任务</label>
              <span class="ui-select-wrap">
                <select id="concurrency" class="ui-select">
                  <option value="2">2 路</option>
                  <option value="4">4 路（推荐）</option>
                  <option value="6">6 路</option>
                  <option value="8">8 路</option>
                  <option value="auto">自动（内存自适应）</option>
                </select>
              </span>
              <p class="field-help">每个网页单独调度；实际并发数还受浏览器内存限制。</p>
            </div>
          </div>
          <div class="setting-switch">
            <label for="remember-position">
              <input id="remember-position" class="ui-switch" type="checkbox" role="switch" />
              记住浮动面板位置
            </label>
          </div>
        </section>

        <section class="surface" aria-labelledby="platform-settings-title">
          <h2 id="platform-settings-title">各平台解析方式</h2>
          <p class="section-hint">默认采用平台最合适的方式，必要时可以手动切换优先级。</p>
          <div class="table-wrap">
            <table class="platform-table">
              <thead><tr><th scope="col">平台</th><th scope="col">默认方式</th><th scope="col">当前设置</th></tr></thead>
              <tbody id="platform-strategies"></tbody>
            </table>
          </div>
        </section>

        <section class="surface" id="about-feedback" aria-labelledby="feedback-title">
          <h2 id="feedback-title">问题反馈</h2>
          <p class="section-hint">下载失败时，可以附上问题网页、视频标题及控制台报错。不要公开 Cookie 或包含私密 Token 的视频链接。</p>
          <div class="feedback-actions">
            <a class="ui-button" href="https://github.com/natefox2017/video_downloader/issues/new" target="_blank" rel="noopener noreferrer">提交 Bug</a>
            <a class="ui-button ui-button--quiet" href="https://github.com/natefox2017/video_downloader" target="_blank" rel="noopener noreferrer">查看开源仓库</a>
          </div>
        </section>
        <footer class="page-footer">设置会自动保存在当前浏览器中</footer>
      </div>
    </main>
  </div>
  <script src="rules.js"></script>
  <script src="options.js"></script>
</body>
</html>
